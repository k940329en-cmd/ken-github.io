<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken's Cyber Space</title>
    <!-- 引入字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace, sans-serif;
        }

        body {
            background-color: #05050a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden; /* 防止左右出現滾動條 */
        }

        /* 粒子背景容器（讓它允許點擊穿透） */
        #tsparticles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none; /* 🌟 讓滑鼠點擊可以穿透粒子層 */
        }

        /* 前景內容卡片（確保它可以被點擊） */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 25, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            pointer-events: auto; /* 🌟 確保卡片和裡面的按鈕可以被正常點擊 */
        }

        /* 霓虹文字效果 */
        h1 {
            font-size: 2.5rem;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6), 0 0 20px rgba(0, 243, 255, 0.4);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            color: #8a99ad;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* 科技感按鈕 */
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            color: #ff007f;
            border: 1px solid #ff007f;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            background: transparent;
            cursor: pointer;
            position: relative;
            z-index: 20; /* 🌟 確保按鈕在最上層 */
        }

        .btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6), 0 0 40px rgba(255, 0, 127, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 粒子背景 -->
    <div id="tsparticles"></div>

    <!-- 網頁核心內容 -->
    <div class="container">
        <h1>KEN_PROJECT.EXE</h1>
        <p>歡迎來到我的科技感個人空間。目前網站正在建構中，核心粒子矩陣與霓虹協議已啟動...</p>
        <!-- 這裡可以把 # 改成你想連過去的網址，例如你的 IG 或 其他頁面 -->
        <a href="https://github.com/k940329en-cmd" class="btn">ENTER SYSTEM</a>
    </div>

    <!-- 引入 tsParticles 粒子庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/preset-links@2/tsparticles.preset.links.bundle.min.js"></script>
    <script>
        tsParticles.load("tsparticles", {
            preset: "links",
            background: { color: "transparent" },
            particles: {
                color: { value: "#00f3ff" },
                links: {
                    color: "#00f3ff",
                    distance: 150,
                    enable: true,
                    opacity: 0.4,
                    width: 1
                },
                move: { enable: true, speed: 1.5 },
                size: { value: { min: 1, max: 3 } },
                opacity: { value: { min: 0.3, max: 0.7 } }
            },
            interactivity: {
                events: {
                    onHover: {
                        enable: true,
                        mode: "grab"
                    }
                }
            }
        });
    </script>
</body>
</html>
